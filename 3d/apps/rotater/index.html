<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTATER — STL Spin Viewer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script>if (localStorage.getItem('rotater_settings')) document.documentElement.classList.add('has-session');</script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
            "gifenc": "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js",
            "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
        }
    }
    </script>
</head>

<body>
    <div class="container">
        <header>
            <img src="rotater.svg" alt="ROTATER" class="logo">
            <p>View and export rotating 3D models.</p>
            <label for="fileInput" class="file-label compact-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
                    style="display:inline;margin-right:5px;vertical-align:middle">
                    <path
                        d="M12.0002 21.8C11.6335 21.8 11.321 21.6708 11.0627 21.4125C10.8044 21.1542 10.6752 20.8417 10.6752 20.475V13.35H3.5252C3.15853 13.35 2.84603 13.2208 2.5877 12.9625C2.32936 12.7042 2.2002 12.3917 2.2002 12.025C2.2002 11.6583 2.32936 11.3458 2.5877 11.0875C2.84603 10.8292 3.15853 10.7 3.5252 10.7H10.6502V3.52501C10.6502 3.15835 10.7794 2.84585 11.0377 2.58751C11.296 2.32918 11.6085 2.20001 11.9752 2.20001C12.3419 2.20001 12.6544 2.32918 12.9127 2.58751C13.171 2.84585 13.3002 3.15835 13.3002 3.52501V10.675H20.4752C20.8419 10.675 21.1544 10.8042 21.4127 11.0625C21.671 11.3208 21.8002 11.6333 21.8002 12C21.8002 12.3667 21.671 12.6792 21.4127 12.9375C21.1544 13.1958 20.8419 13.325 20.4752 13.325H13.3252V20.475C13.3252 20.8417 13.196 21.1542 12.9377 21.4125C12.6794 21.6708 12.3669 21.8 12.0002 21.8Z" />
                </svg>
                <span id="compactBtnLabel">Select STL</span>
            </label>
            <div class="menu-wrap">
                <button id="btnMenu" class="menu-btn" title="More options" aria-label="More options"
                    aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <div id="menuDropdown" class="menu-dropdown" hidden>
                    <button id="menuBenchy" class="menu-item" title="Replace current model with 3D Benchy demo">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z" />
                        </svg>
                        Reset to Benchy
                    </button>
                </div>
            </div>
        </header>

        <main id="dropZone">
            <div class="upload-section" id="emptyState">
                <label for="fileInput" class="file-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                        style="display:inline;margin-right:8px;vertical-align:middle">

                            d="M12.0002 21.8C11.6335 21.8 11.321 21.6708 11.0627 21.4125C10.8044 21.1542 10.6752 20.8417 10.6752 20.475V13.35H3.5252C3.15853 13.35 2.84603 13.2208 2.5877 12.9625C2.32936 12.7042 2.2002 12.3917 2.2002 12.025C2.2002 11.6583 2.32936 11.3458 2.5877 11.0875C2.84603 10.8292 3.15853 10.7 3.5252 10.7H10.6502V3.52501C10.6502 3.15835 10.7794 2.84585 11.0377 2.58751C11.296 2.32918 11.6085 2.20001 11.9752 2.20001C12.3419 2.20001 12.6544 2.32918 12.9127 2.58751C13.171 2.84585 13.3002 3.15835 13.3002 3.52501V10.675H20.4752C20.8419 10.675 21.1544 10.8042 21.4127 11.0625C21.671 11.3208 21.8002 11.6333 21.8002 12C21.8002 12.3667 21.671 12.6792 21.4127 12.9375C21.1544 13.1958 20.8419 13.325 20.4752 13.325H13.3252V20.475C13.3252 20.8417 13.196 21.1542 12.9377 21.4125C12.6794 21.6708 12.3669 21.8 12.0002 21.8Z" />
                    </svg>
                    Select STL
                    <input type="file" id="fileInput" accept=".stl">
                </label>
                <p class="drop-hint">or drop an STL file here</p>
            </div>
            <div id="viewerSection" class="viewer-section hidden">
                <div class="canvas-wrap">
                    <canvas id="canvas"></canvas>
                    <button id="btnRotateCCW" class="pause-btn rotate-ccw-btn" title="Rotate 90° counter-clockwise"
                        aria-label="Rotate 90° counter-clockwise">

                        </svg>
                    </button>
                    <button id="btnFrontView" class="pause-btn front-view-btn"

                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M5 15H3v4c0 1.1.9 2 2 2h4v-2H5v-4zM5 5h4V3H5C3.9 3 3 3.9 3 5v4h2V5zm14-2h-4v2h4v4h2V5c0-1.1-.9-2-2-2zm0 16h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zM12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />

                        </svg>
                    </button>
                    <button id="btnPause" class="pause-btn" title="Pause/Resume rotation" aria-label="Pause rotation">

                    </button>
                    <span id="fileName" class="file-name"></span>
                </div>
            </div>
        </main>

        <div id="controlsBar" class="controls-bar hidden">
            <div class="controls-row">
                <div class="control-label">
                    Colors
                    <div class="color-group">
                        <label class="color-option" title="Choose model color">
                            <input type="color" id="colorPicker" value="#aab8c8">
                            <span class="color-swatch" id="colorSwatch"></span>
                            <span class="color-name">Model</span>
                        </label>
                        <label class="color-option" title="Choose background color">
                            <input type="color" id="bgPicker" value="#0a0a12">
                            <span class="color-swatch" id="bgSwatch"></span>
                            <span class="color-name">BG</span>
                        </label>
                    </div>
                </div>
                <label class="control-label">
                    Shading
                    <div class="shading-group">
                        <label class="shading-option">
                            <input type="radio" name="shading" value="flat">
                            <span class="shading-thumb shading-thumb--flat"></span>
                            <span class="shading-name">Flat</span>
                        </label>
                        <label class="shading-option">
                            <input type="radio" name="shading" value="phong" checked>
                            <span class="shading-thumb shading-thumb--phong"></span>
                            <span class="shading-name">Phong</span>
                        </label>
                        <label class="shading-option">
                            <input type="radio" name="shading" value="metallic">
                            <span class="shading-thumb shading-thumb--metallic"></span>
                            <span class="shading-name">Metal</span>
                        </label>
                    </div>
                </label>
                <button id="btnResetCamera" class="reset-cam-btn" title="Reset camera to default view"
                    aria-label="Reset camera to default view">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path

                    </svg>
                    Reset View
                </button>
            </div>
            <div class="controls-row controls-row--motion">
                <div class="control-label">
                    Rotation
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="rotateMode" value="off">
                            Off
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="rotateMode" value="spin" checked>
                            <svg class="rot-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path
                                    d="M12 4C9.4 4 7.05 5.08 5.37 6.84L7 8.5H2.5V4l1.71 1.71C5.96 3.66 8.83 2 12 2c4.42 0 8.17 2.87 9.5 6.84l-1.93.64A8 8 0 0 0 12 4zm0 16a8 8 0 0 0 7.57-5.48l1.93.64C20.17 19.13 16.42 22 12 22c-3.17 0-6.04-1.66-7.79-4.21L2.5 19.5V15H7l-1.63 1.66C7.05 18.92 9.4 20 12 20z" />
                            </svg>
                            Spin<span class="pause-hint" aria-hidden="true"></span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="rotateMode" value="tilt">
                            <svg class="rot-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z" />
                            </svg>
                            Tilt<span class="pause-hint" aria-hidden="true"></span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="rotateMode" value="wobble">
