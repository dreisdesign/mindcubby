<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTATER — STL Spin Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
            "gifenc": "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js",
            "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
        }
    }
    </script>
</head>

<body>
    <div class="container">
        <header>
            <h1>ROTATER</h1>
            <p>View and export rotating 3D models.</p>
            <label for="fileInput" class="file-label compact-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
                    style="display:inline;margin-right:5px;vertical-align:middle">
                    <path
                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z" />
                </svg>
                Select STL
            </label>
        </header>

        <main id="dropZone">
            <div class="upload-section" id="emptyState">
                <label for="fileInput" class="file-label">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
                        style="display:inline;margin-right:8px;vertical-align:middle">
                        <path
                            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z" />
                    </svg>
                    Select STL
                    <input type="file" id="fileInput" accept=".stl">
                </label>
                <p class="drop-hint">or drop an STL file here</p>
            </div>
            <div id="viewerSection" class="viewer-section hidden">
                <div class="canvas-wrap">
                    <canvas id="canvas"></canvas>
                    <button id="btnPause" class="pause-btn" title="Pause/Resume rotation" aria-label="Pause rotation">
                        <svg id="iconPause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="5" y="3" width="4" height="18" rx="1" />
                            <rect x="15" y="3" width="4" height="18" rx="1" />
                        </svg>
                        <svg id="iconPlay" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
                            style="display:none">
                            <polygon points="5,3 19,12 5,21" />
                        </svg>
                    </button>
                    <span id="fileName" class="file-name"></span>
                </div>
            </div>
        </main>

        <div id="controlsBar" class="controls-bar hidden">
            <div class="controls-row">
                <label class="control-label">
                    Color
                    <input type="color" id="colorPicker" value="#aab8c8">
                </label>
                <label class="control-label">
                    Background
                    <input type="color" id="bgPicker" value="#0a0a12">
                </label>
                <label class="control-label">
                    Shading
                    <select id="shading">
                        <option value="metallic">Metallic</option>
                        <option value="phong" selected>Phong</option>
                        <option value="flat">Flat</option>
                    </select>
                </label>
                <label class="control-label range-label">
                    <span>Speed <span id="speedVal">1.0×</span></span>
                    <input type="range" id="speedSlider" min="0.2" max="4" step="0.1" value="1.0">
                </label>
                <label class="control-label range-label">
                    <span>Elevation <span id="elevVal">28°</span></span>
                    <input type="range" id="elevationSlider" min="5" max="75" step="1" value="28">
                </label>
            </div>
            <div class="export-row">
                <div class="export-group">
                    <button id="btnExportGif" class="primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                            style="display:inline;margin-right:8px;vertical-align:middle">
                            <path
                                d="M4.5252 20.175H19.5002C19.8669 20.175 20.1752 20.3 20.4252 20.55C20.6752 20.8 20.8002 21.1083 20.8002 21.475C20.8002 21.8417 20.671 22.1542 20.4127 22.4125C20.1544 22.6708 19.8419 22.8 19.4752 22.8H4.5002C4.13353 22.8 3.8252 22.6708 3.5752 22.4125C3.3252 22.1542 3.2002 21.8417 3.2002 21.475C3.2002 21.1083 3.32936 20.8 3.5877 20.55C3.84603 20.3 4.15853 20.175 4.5252 20.175ZM12.0002 17.375C11.8169 17.375 11.6335 17.3333 11.4502 17.25C11.2669 17.1667 11.1085 17.0417 10.9752 16.875L5.4752 9.975C5.1252 9.54166 5.0752 9.075 5.3252 8.575C5.5752 8.075 5.9752 7.825 6.5252 7.825H8.3502V2.525C8.3502 2.15833 8.47936 1.84583 8.7377 1.5875C8.99603 1.32916 9.30853 1.2 9.6752 1.2H14.3252C14.6919 1.2 15.0044 1.32916 15.2627 1.5875C15.521 1.84583 15.6502 2.15833 15.6502 2.525V7.825H17.4752C18.0252 7.825 18.4252 8.075 18.6752 8.575C18.9252 9.075 18.8752 9.54166 18.5252 9.975L13.0252 16.875C12.8919 17.0417 12.7335 17.1667 12.5502 17.25C12.3669 17.3333 12.1835 17.375 12.0002 17.375Z" />
                        </svg>
                        Download GIF
                    </button>
                    <span id="estimateGif" class="export-estimate"></span>
                </div>
                <div class="export-group">
                    <button id="btnExportVideo" class="secondary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                            style="display:inline;margin-right:8px;vertical-align:middle">
                            <path
                                d="M4.5252 20.175H19.5002C19.8669 20.175 20.1752 20.3 20.4252 20.55C20.6752 20.8 20.8002 21.1083 20.8002 21.475C20.8002 21.8417 20.671 22.1542 20.4127 22.4125C20.1544 22.6708 19.8419 22.8 19.4752 22.8H4.5002C4.13353 22.8 3.8252 22.6708 3.5752 22.4125C3.3252 22.1542 3.2002 21.8417 3.2002 21.475C3.2002 21.1083 3.32936 20.8 3.5877 20.55C3.84603 20.3 4.15853 20.175 4.5252 20.175ZM12.0002 17.375C11.8169 17.375 11.6335 17.3333 11.4502 17.25C11.2669 17.1667 11.1085 17.0417 10.9752 16.875L5.4752 9.975C5.1252 9.54166 5.0752 9.075 5.3252 8.575C5.5752 8.075 5.9752 7.825 6.5252 7.825H8.3502V2.525C8.3502 2.15833 8.47936 1.84583 8.7377 1.5875C8.99603 1.32916 9.30853 1.2 9.6752 1.2H14.3252C14.6919 1.2 15.0044 1.32916 15.2627 1.5875C15.521 1.84583 15.6502 2.15833 15.6502 2.525V7.825H17.4752C18.0252 7.825 18.4252 8.075 18.6752 8.575C18.9252 9.075 18.8752 9.54166 18.5252 9.975L13.0252 16.875C12.8919 17.0417 12.7335 17.1667 12.5502 17.25C12.3669 17.3333 12.1835 17.375 12.0002 17.375Z" />
                        </svg>
                        Download MP4
                    </button>
                    <span id="estimateMp4" class="export-estimate"></span>
                </div>
                <span id="exportStatus" class="export-status"></span>
            </div>
        </div>

        <footer>
            <p>Drag to orbit · Ctrl+scroll to zoom · Right-drag to pan</p>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
