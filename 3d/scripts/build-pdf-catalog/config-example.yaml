# PDF Catalog Generator - Generic Example Configuration
# Customize this file for your project

paths:
  input_dir: "./thumbnails"           # Directory containing variant folders
  output_pdf: "./catalog.pdf"         # Output PDF file path
  branding_text: "My Catalog"         # Footer branding text

grid:
  images_per_row: 6                   # Images per row
  rows_per_page: 3                    # Rows per page (6x3 = 18 images/page)

image:
  width_inches: 1.3                   # Image width in inches
  height_inches: 1.3                  # Image height in inches
  horizontal_spacing_inches: 0.35     # Space between images (horizontal)
  vertical_spacing_inches: 2.3        # Space between images (vertical, for labels)

layout:
  margin_lr_inches: 0.6               # Left/right margins
  title_area_inches: 1.4              # Space reserved for title
  footer_area_inches: 0.5             # Space reserved for footer
  page_orientation: "landscape"       # portrait or landscape

text:
  title_font: "Helvetica-Bold"
  title_size: 26
  subtitle_font: "Helvetica"
  subtitle_size: 11
  label_font: "Helvetica-Bold"
  label_size: 9
  footer_font: "Helvetica"
  footer_size: 8

colors:
  title: "#222222"                    # Title color (dark gray)
  subtitle: "#666666"                 # Subtitle color (medium gray)
  label_primary: "#111111"            # Primary label (black)
  label_secondary: "#555555"          # Secondary label (gray)
  label_filename: "#AAAAAA"           # Filename label (light gray)
  footer: "#999999"                   # Footer text (gray)
  image_background: "#FFFFFF"         # Background behind images (white)

metadata:
  pattern: "auto"                     # auto-detect from filename
  separator: "--"                     # Filename component separator
  components:
    - "position"                      # First component
    - "type"                          # Second component
    - "size_label"                    # Third component (part 1 of pair)
    - "size_value"                    # Third component (part 2)
    - "texture"                       # Last component

batch:
  variant_pattern: "*"                # Glob pattern for variant folders (* = all)
  test_mode: 0                        # 0 = all images, or set to number to limit per variant
