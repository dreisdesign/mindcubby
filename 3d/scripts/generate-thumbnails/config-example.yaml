# Generate Thumbnails Configuration

# Paths
paths:
  # Input: Root directory containing variant folders with STL files
  input_dir: /path/to/stls
  # Output: Where PNG thumbnails will be saved (organized by variant)
  output_dir: /path/to/output

# Render settings
render:
  # Image dimensions
  resolution_x: 512
  resolution_y: 512
  
  # Render engine: EEVEE (fast) or CYCLES (quality)
  engine: EEVEE
  
  # Sample count (mainly for Cycles)
  samples: 16
  
  # Force re-rendering of existing thumbnails
  force_rerender: false

# Scene setup
scene:
  # Camera position and orientation
  camera_location: [110, -110, 90]
  camera_rotation: [75, 0, 45]  # in degrees
  
  # Sun light position, energy, and orientation
  light_location: [100, -100, 200]
  light_energy: 5.0
  light_rotation: [45, 0, 30]  # in degrees
  
  # Background color (RGBA)
  background_color: [1, 1, 1, 1]  # white

# Output format
output:
  format: PNG
  include_alpha: true

# Batch processing
batch:
  # Skip existing thumbnails (false = re-render all)
  skip_existing: false
  
  # Glob pattern for variant folder names (e.g., "01_*", "variant-*")
  variant_pattern: "*"
  
  # Test mode: limit renders per variant (0 = all, 5 = first 5 only)
  test_mode: 0
