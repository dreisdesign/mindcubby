# Generate Thumbnails - Stackables Example Configuration

# This config shows how to use generate-thumbnails for the Stackables project
# 
# ⚠️  IMPORTANT: Update the paths below to match your system before use
# Stackables files should be in your Documents, not committed to GitHub

paths:
  input_dir: /Users/danielreis/Documents/3D_PRINTING/MODELS/154. Stackables/ETSY_EXPORTS-AND-PACKAGING/02-ALIGNED-STLS
  output_dir: /Users/danielreis/Documents/3D_PRINTING/MODELS/154. Stackables/BLENDER_THUMBNAIL-GENERATOR/OUTPUT

render:
  resolution_x: 512
  resolution_y: 512
  engine: EEVEE
  samples: 16
  force_rerender: false

scene:
  camera_location: [110, -110, 90]
  camera_rotation: [75, 0, 45]
  light_location: [100, -100, 200]
  light_energy: 5.0
  light_rotation: [45, 0, 30]
  background_color: [1, 1, 1, 1]

output:
  format: PNG
  include_alpha: true

batch:
  skip_existing: false
  variant_pattern: "*"
  test_mode: 0  # Change to 2 for testing
