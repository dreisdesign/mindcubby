<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:image" content="/apple-touch-icon.png">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/main.css">
    
    <script>
        (function () {
            const root = document.documentElement;
            const theme = localStorage.getItem('app-theme') || 'vanilla';
            const appearance = localStorage.getItem('app-appearance') || 'light';
            root.classList.add(`theme-${theme}`, `appearance-${appearance}`);
        })();
    </script>

    <script type="module">
        import '/libs/smoothie-design-system/v3.0/src/components/labs-header.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-button.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-container.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-card.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-theme-button.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-theme-toggle.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-icon.js';
    </script>
</head>

<body>
    <labs-container medium>
        <labs-header center>
            <div slot="title">Page Title</div>
            <div slot="actions" style="display: flex; gap: 1rem; align-items: center;">
                <labs-theme-button></labs-theme-button>
                <labs-theme-toggle icon-only></labs-theme-toggle>
            </div>
        </labs-header>

        <main>
            <labs-card>
                <div slot="header">Sample Card</div>
                <div slot="description">Welcome to the boilerplate template. This card demonstrates Smoothie components.</div>
                <labs-button slot="actions" variant="primary">
                    <labs-icon slot="icon-left" name="add"></labs-icon>
                    Action
                </labs-button>
            </labs-card>
        </main>
    </labs-container>

    <script>
        // Theme toggle handles all theme management internally
        // Just listen for theme changes if needed:
        const themeToggle = document.querySelector('labs-theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('mode-changed', (e) => {
                console.log('Theme changed to:', e.detail.mode);
            });
        }
    </script>
</body>

</html>
