<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:image" content="/apple-touch-icon.png">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/main.css">
    
    <script>
        (function () {
            const root = document.documentElement;
            const theme = localStorage.getItem('app-theme') || 'vanilla';
            const appearance = localStorage.getItem('app-appearance') || 'light';
            root.classList.add(`theme-${theme}`, `appearance-${appearance}`);
        })();
    </script>

    <script type="module">
        import '/libs/smoothie-design-system/v3.0/src/components/labs-header.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-button.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-container.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-card.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-dropdown.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-icon.js';
    </script>
</head>

<body>
    <labs-header>
        <h1 slot="title">Page Title</h1>
        <div slot="actions" id="theme-controls" style="display: flex; gap: 1rem; align-items: center;">
            <labs-dropdown id="theme-selector">
                <labs-button slot="trigger" variant="secondary" size="small">
                    <span id="theme-label">Vanilla</span>
                </labs-button>
                <div slot="content">
                    <button data-theme="vanilla">Vanilla</button>
                    <button data-theme="blueberry">Blueberry</button>
                    <button data-theme="strawberry">Strawberry</button>
                </div>
            </labs-dropdown>
            <labs-button id="appearance-toggle" variant="secondary" size="small">
                <labs-icon slot="icon-left" name="brightness"></labs-icon>
                <span id="appearance-label">Light</span>
            </labs-button>
        </div>
    </labs-header>

    <main>
        <labs-container size="medium">
            <labs-card>
                <div slot="header">Sample Card</div>
                <div slot="description">Welcome to the boilerplate template. This card demonstrates Smoothie components.</div>
                <labs-button slot="actions" variant="primary">
                    <labs-icon slot="icon-left" name="add"></labs-icon>
                    Action
                </labs-button>
            </labs-card>
        </labs-container>
    </main>

    <script>
        const htmlElement = document.documentElement;

        // Theme management
        const themeSelector = document.getElementById('theme-selector');
        const themeLabel = document.getElementById('theme-label');
        const appearanceToggle = document.getElementById('appearance-toggle');
        const appearanceLabel = document.getElementById('appearance-label');

        const savedTheme = localStorage.getItem('app-theme') || 'vanilla';
        const savedAppearance = localStorage.getItem('app-appearance') || 'light';
        let currentTheme = savedTheme;
        let currentAppearance = savedAppearance;

        function applyTheme(theme) {
            htmlElement.classList.remove('theme-vanilla', 'theme-blueberry', 'theme-strawberry');
            htmlElement.classList.add(`theme-${theme}`);
            themeLabel.textContent = theme.charAt(0).toUpperCase() + theme.slice(1);
            localStorage.setItem('app-theme', theme);
            currentTheme = theme;
        }

        function applyAppearance(appearance) {
            htmlElement.classList.remove('appearance-light', 'appearance-dark');
            htmlElement.classList.add(`appearance-${appearance}`);
            appearanceLabel.textContent = appearance.charAt(0).toUpperCase() + appearance.slice(1);
            localStorage.setItem('app-appearance', appearance);
            currentAppearance = appearance;
        }

        // Initialize
        applyTheme(savedTheme);
        applyAppearance(savedAppearance);

        // Theme dropdown
        const themeButtons = themeSelector.querySelectorAll('button[data-theme]');
        themeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.getAttribute('data-theme');
                applyTheme(theme);
                themeSelector.removeAttribute('data-open');
            });
        });

        // Appearance toggle
        appearanceToggle.addEventListener('click', () => {
            const newAppearance = currentAppearance === 'dark' ? 'light' : 'dark';
            applyAppearance(newAppearance);
        });
    </script>
</body>

</html>
