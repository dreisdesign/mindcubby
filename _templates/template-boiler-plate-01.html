<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:image" content="/apple-touch-icon.png">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/main.css">
    
    <script>
        (function () {
            const root = document.documentElement;
            const theme = localStorage.getItem('app-theme') || 'vanilla';
            const appearance = localStorage.getItem('app-appearance') || 'light';
            root.classList.add(`theme-${theme}`, `appearance-${appearance}`);
        })();
    </script>

    <script type="module">
        import '/libs/smoothie-design-system/v3.0/src/components/labs-header.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-button.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-container.js';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-card.js';
    </script>
</head>

<body>
    <labs-header>
        <h1 slot="title">Page Title</h1>
        <labs-button slot="actions" id="theme-toggle">Dark</labs-button>
    </labs-header>

    <main>
        <labs-container size="medium">
            <labs-card>
                <div slot="header">Card Title</div>
                <div slot="description">Card content goes here. This is a semantic card element from Smoothie.</div>
            </labs-card>
        </labs-container>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        const savedAppearance = localStorage.getItem('app-appearance') || 'light';
        let currentAppearance = savedAppearance;

        function applyAppearance(appearance) {
            htmlElement.classList.remove('appearance-light', 'appearance-dark');
            htmlElement.classList.add(`appearance-${appearance}`);
            themeToggle.textContent = appearance === 'dark' ? 'Light' : 'Dark';
            localStorage.setItem('app-appearance', appearance);
            currentAppearance = appearance;
        }

        applyAppearance(savedAppearance);

        themeToggle.addEventListener('click', () => {
            const newAppearance = currentAppearance === 'dark' ? 'light' : 'dark';
            applyAppearance(newAppearance);
        });
    </script>
</body>

</html>
