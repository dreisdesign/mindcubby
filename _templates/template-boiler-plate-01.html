<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:image" content="/apple-touch-icon.png">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/main.css?v=87">
    
    <script>
        (function () {
            const root = document.documentElement;
            const theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            const appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.add(`theme-${theme}`, `appearance-${appearance}`);
        })();
    </script>

    <script type="module">
        import '/libs/smoothie-design-system/v3.0/src/components/labs-footer-settings-wrapper.js?v=87';
        import '/libs/smoothie-design-system/v3.0/src/components/labs-container.js?v=87';
    </script>
</head>

<body>
    <!-- Settings Modal in Footer -->
    <labs-footer-settings-wrapper>
        <div slot="left"></div>
    </labs-footer-settings-wrapper>

    <!-- Main Content -->
    <labs-container medium>
        <h1>Page Title</h1>
        <p>Your content here.</p>
    </labs-container>
</body>

</html>
