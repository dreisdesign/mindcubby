<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCubby Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #333;
            line-height: 1.5;
            font-size: 14px;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .admin-section {
            border: 1px solid #999;
            padding: 20px;
            margin-bottom: 20px;
        }

        .admin-section h2 {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        input[type="password"],
        input[type="text"],
        button {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }

        button {
            background: #000;
            color: white;
            cursor: pointer;
            border: 1px solid #000;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        .status-message {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #999;
            font-size: 12px;
            display: none;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .info {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 11px;
            margin-bottom: 15px;
        }

        code {
            background: #f0f0f0;
            padding: 2px 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 MindCubby Admin</h1>

        <div class="admin-section">
            <h2>Cache Refresh</h2>
            <div class="info">
                Cache expires every 24 hours. Click below to refresh products immediately after adding new items or updating prices/photos on Etsy.
            </div>
            <button onclick="refreshCache()">🔄 Refresh Cache Now</button>
            <div id="refresh-status" class="status-message"></div>
        </div>

        <div class="admin-section">
            <h2>Cache Status</h2>
            <button onclick="checkCacheStatus()">📊 Check Status</button>
            <div id="cache-status" class="status-message" style="font-family: monospace; white-space: pre-wrap; overflow-x: auto;"></div>
        </div>

        <div class="admin-section">
            <h2>View Shop</h2>
            <button onclick="window.location.href='/shop.html'">👥 Go to Public Shop</button>
        </div>
    </div>

    <script>
        async function refreshCache() {
            const statusEl = document.getElementById('refresh-status');
            const btn = event.target;
            
            btn.disabled = true;
            btn.textContent = '⏳ Refreshing...';

            try {
                // Redirect to OAuth with return_to parameter pointing back to admin
                window.location.href = '/api/auth/etsy?return_to=/admin.html%3Fauthorized=1';
                
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
                statusEl.className = 'status-message error';
                btn.disabled = false;
                btn.textContent = '🔄 Refresh Cache Now';
            }
        }

        async function checkCacheStatus() {
            const statusEl = document.getElementById('cache-status');
            const btn = event.target;
            
            btn.disabled = true;
            btn.textContent = '⏳ Checking...';

            try {
                const response = await fetch('/api/etsy/cache-refresh-needed');
                const data = await response.json();
                
                statusEl.textContent = JSON.stringify(data, null, 2);
                statusEl.className = 'status-message ' + (data.needs_refresh ? 'error' : 'success');
                
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
                statusEl.className = 'status-message error';
            }
            
            btn.disabled = false;
            btn.textContent = '📊 Check Status';
        }

        // Check if returning from OAuth refresh
        if (window.location.search.includes('authorized')) {
            const statusEl = document.getElementById('refresh-status');
            statusEl.textContent = '✅ Cache refreshed! Products updated.';
            statusEl.className = 'status-message success';
            // Clean URL
            window.history.replaceState({}, document.title, '/admin.html');
        }
    </script>
</body>
</html>
