<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCubby</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .tagline {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .cta-button {
            display: inline-block;
            padding: 12px 30px;
            background: #333;
            color: white;
            text-decoration: none;
            border: 1px solid #333;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cta-button:hover {
            background: white;
            color: #333;
        }

        .links {
            margin-top: 40px;
            font-size: 12px;
        }

        .links a {
            color: #666;
            text-decoration: none;
            margin: 0 15px;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MindCubby</h1>
        <p class="tagline">3D Printable Designs</p>
        <a href="/etsy/" class="cta-button">Shop Now</a>
        <div class="links">
            <a href="/etsy/">Shop</a>
            <a href="https://www.etsy.com/shop/MindCubby" target="_blank">Etsy</a>
        </div>
    </div>
</body>

</html>
