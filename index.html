<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCubby</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/+esm"></script>
    <style>
        :root {
            --bg: #f5f5f5;
            --text: #222;
            --accent: #2e2b74;
            --border: #e1e4e8;
            --code-bg: #f6f8fa;
        }

        [data-theme="dark"] {
            --bg: #0f1720;
            --text: #f7f7fb;
            --accent: #9fb3ff;
            --border: #30363d;
            --code-bg: #161b22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent);
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #content {
            font-size: 1.05rem;
        }

        #content h1 {
            font-size: 2.5rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        #content h2 {
            font-size: 1.75rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        #content h3,
        #content h4 {
            font-size: 1.25rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        #content p {
            margin-bottom: 1rem;
        }

        #content ul,
        #content ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        #content li {
            margin-bottom: 0.5rem;
        }

        #content a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        #content a:hover {
            border-bottom-color: var(--accent);
        }

        #content code {
            background: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }

        #content pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        #content pre code {
            background: none;
            padding: 0;
            font-size: 1em;
        }

        #content hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 2rem 0;
        }

        #content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            margin-left: 0;
            margin-bottom: 1rem;
            color: #666;
        }

        [data-theme="dark"] #content blockquote {
            color: #a8b5c8;
        }

        #content img {
            max-width: 100%;
            height: auto;
            margin: 1rem 0;
            border-radius: 6px;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .error {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        [data-theme="dark"] .error {
            background: #332701;
            border-color: #997404;
            color: #ffb81c;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            header {
                flex-direction: column;
                gap: 1rem;
            }

            #content h1 {
                font-size: 2rem;
            }

            #content h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">MindCubby</div>
        <button id="themeToggle" class="theme-toggle">🌙 Theme</button>
    </header>

    <div class="container">
        <div id="content" class="loading">Loading...</div>
    </div>

    <script type="module">
        import { marked } from 'https://cdn.jsdelivr.net/npm/marked@11.1.1/+esm';

        const contentDiv = document.getElementById('content');
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        // Theme persistence
        const saved = localStorage.getItem('mindcubby-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = saved || (prefersDark ? 'dark' : 'light');

        function applyTheme(t) {
            if (t === 'dark') {
                root.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️ Theme';
            } else {
                root.removeAttribute('data-theme');
                themeToggle.textContent = '🌙 Theme';
            }
            localStorage.setItem('mindcubby-theme', t);
        }

        applyTheme(theme);

        themeToggle.addEventListener('click', () => {
            theme = theme === 'dark' ? 'light' : 'dark';
            applyTheme(theme);
        });

        // Fetch and render README
        async function loadReadme() {
            try {
                const response = await fetch('README.md');
                if (!response.ok) throw new Error('Failed to fetch README');

                const markdown = await response.text();
                const html = marked.parse(markdown);
                contentDiv.innerHTML = html;
                contentDiv.className = '';
            } catch (error) {
                contentDiv.className = 'error';
                contentDiv.innerHTML = `<strong>Error:</strong> Could not load README.md (${error.message})`;
            }
        }

        loadReadme();
    </script>
</body>

</html>
