<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="favicon.ico">
  <title>Labs: Note</title>

  <!-- Early Theme Injection -->
  <script type="module">
    import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
    ThemeManager.init('note');
  </script>

  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
      var appearance = localStorage.getItem('smoothie-appearance') || 'light';
      root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
      root.classList.remove('appearance-light', 'appearance-dark');
      root.classList.add('theme-' + theme);
      root.classList.add('appearance-' + appearance);
      root.setAttribute('data-color-scheme', appearance);
    })();
  </script>

  <!-- Design System Tokens -->
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css?v=147">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css?v=147">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/spacing.css?v=147">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css?v=147">
  <!-- Components -->
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer-settings-wrapper.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-card.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-overlay.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-toast.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js?v=35"></script>

  <!-- Note App Components -->
  <script type="module" src="./components/note-input-card.js"></script>

  <!-- Note App Logic -->
  <script type="module" src="./js/main.js?v=147"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-family-base);
    }

    labs-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      /* ensure the main container doesn't push the footer off-screen; allow internal scrolling */
      min-height: 0;
      overflow: auto;
    }

    note-input-card {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      flex: 0 0 auto;
    }

    .note-display-area.expanded note-input-card {
      max-width: 100%;
      flex: 1;
    }

    /* Position toast above the footer */
    labs-toast {
      --toast-bottom: 120px;
    }
  </style>

  <script>
    // Listen for reset-all from the footer wrapper component
    const footerWrapper = document.querySelector('labs-footer-settings-wrapper');
    if (footerWrapper) {
      footerWrapper.addEventListener('reset-all', () => {
        // Clear all note data from localStorage
        const keys = Object.keys(localStorage);
        keys.forEach(key => {
          if (key.startsWith('note-')) {
            localStorage.removeItem(key);
          }
        });
        // Reload the page to show cleared state
        location.reload();
      });
    }
  </script>
</head>

<body>
  <labs-container>
    <!-- Note display area with header and card together -->
    <div class="note-display-area">
      <!-- Header with current date -->
      <labs-header id="note-header" center>
        <div slot="title" style="text-align: center;">
          <div class="date-line-1" id="current-date-line-1">Today is Sunday</div>
          <div class="date-line-2" id="current-date-line-2">Oct 19, 2025</div>
        </div>
      </labs-header>

      <note-input-card id="noteInputCard"></note-input-card>
    </div>

    <!-- Toast for Undo -->
    <labs-toast id="undoToast"></labs-toast>
  </labs-container>

  <!-- Footer with Settings Modal (encapsulated in component) -->
  <labs-footer-settings-wrapper>
  </labs-footer-settings-wrapper>

  <!-- Service Worker Registration -->
  <script>
    // Head check to ensure SW exists before registering
    if ("serviceWorker" in navigator) {
      fetch("sw.js", { method: "HEAD" })
        .then(() => {
          navigator.serviceWorker
            .register("sw.js")
            .catch(function (error) {
              console.log("Service Worker registration failed:", error);
            });
        })
        .catch(() => {
          console.log("Service Worker file not found at sw.js");
        });
    }

    // Set current date in header
    document.addEventListener('DOMContentLoaded', function () {
      var line1 = document.getElementById('current-date-line-1');
      var line2 = document.getElementById('current-date-line-2');
      if (line1 && line2) {
        var now = new Date();
        var weekday = now.toLocaleDateString(undefined, { weekday: 'long' });
        var date = now.toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        line1.textContent = 'Today is ' + weekday;
        line2.textContent = date;
      }
    });
  </script>
</body>

</html>
