<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="favicon.ico">
  <title>Labs: Note</title>

  <!-- Early Theme Injection -->
  <script type="module">
    import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
    ThemeManager.init('note');
  </script>

  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
      var appearance = localStorage.getItem('smoothie-appearance') || 'light';
      root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
      root.classList.remove('appearance-light', 'appearance-dark');
      root.classList.add('theme-' + theme);
      root.classList.add('appearance-' + appearance);
      root.setAttribute('data-color-scheme', appearance);
    })();
  </script>

  <!-- Design System Tokens -->
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css">

  <!-- Components -->
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-card.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-toast.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js"></script>

  <!-- Note App Components -->
  <script type="module" src="./components/note-input-card.js"></script>

  <!-- Note App Logic -->
  <script type="module" src="./js/main.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-family-base);
    }

    labs-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      /* ensure the main container doesn't push the footer off-screen; allow internal scrolling */
      min-height: 0;
      overflow: auto;
    }

    note-input-card {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      flex: 0 0 auto;
    }

    .note-display-area.expanded note-input-card {
      max-width: 100%;
      flex: 1;
    }

    /* Position toast above the footer */
    labs-toast {
      --toast-bottom: 120px;
    }
  </style>

  <script>
    // Wire up settings toggle
    const noteModal = document.getElementById('note-settings-modal');
    const noteSettingsToggle = document.getElementById('note-settings-toggle');
    
    noteSettingsToggle.addEventListener('click', () => {
      const isHidden = noteModal.style.display === 'none' || !noteModal.style.display;
      noteModal.style.display = isHidden ? 'flex' : 'none';
    });

    // Close settings when clicking the card's close button
    const noteCard = noteModal.querySelector('labs-settings-card');
    if (noteCard) {
      noteCard.addEventListener('close', () => {
        noteModal.style.display = 'none';
      });
      
      // Handle reset-all event from settings card
      noteCard.addEventListener('reset-all', () => {
        // Clear all note data from localStorage
        const keys = Object.keys(localStorage);
        keys.forEach(key => {
          if (key.startsWith('note-')) {
            localStorage.removeItem(key);
          }
        });
        // Reload the page to show cleared state
        location.reload();
      });
    }

    // Close when clicking backdrop
    noteModal.addEventListener('click', (e) => {
      if (e.target === noteModal) {
        noteModal.style.display = 'none';
      }
    });

    // Close settings on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('note-settings-modal');
        if (modal && modal.style.display === 'flex') {
          modal.style.display = 'none';
        }
      }
    });
  </script>
</head>

<body>
  <labs-container>
    <!-- Note display area with header and card together -->
    <div class="note-display-area">
      <!-- Header with current date -->
      <labs-header id="note-header" center>
        <div slot="title" style="text-align: center;">
          <div class="date-line-1" id="current-date-line-1">Today is Sunday</div>
          <div class="date-line-2" id="current-date-line-2">Oct 19, 2025</div>
        </div>
      </labs-header>

      <note-input-card id="noteInputCard"></note-input-card>
    </div>

    <!-- Toast for Undo -->
    <labs-toast id="undoToast"></labs-toast>
  </labs-container>

  <!-- Footer with Settings -->
  <labs-footer full-width>
    <div slot="right" style="display: flex; align-items: center; gap: 8px;">
      <labs-button id="note-settings-toggle" variant="icon" aria-label="Settings">
        <labs-icon slot="icon-left" name="settings"></labs-icon>
      </labs-button>
    </div>
  </labs-footer>

  <!-- Settings Modal - hidden by default -->
  <div id="note-settings-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 1rem;">
    <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
      <labs-settings-card id="note-settings-card" hide-confirmation style="width: 90%; max-width: 340px;"></labs-settings-card>
    </div>
  </div>

  <!-- Service Worker Registration -->
  <script>
    // Head check to ensure SW exists before registering
    if ("serviceWorker" in navigator) {
      fetch("sw.js", { method: "HEAD" })
        .then(() => {
          navigator.serviceWorker
            .register("sw.js")
            .catch(function (error) {
              console.log("Service Worker registration failed:", error);
            });
        })
        .catch(() => {
          console.log("Service Worker file not found at sw.js");
        });
    }

    // Set current date in header
    document.addEventListener('DOMContentLoaded', function () {
      var dateEl = document.getElementById('current-date');
      if (dateEl) {
        var now = new Date();
        var weekday = now.toLocaleDateString(undefined, { weekday: 'long' });
        var date = now.toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        var line1 = dateEl.querySelector('.date-line-1');
        var line2 = dateEl.querySelector('.date-line-2');

        if (line1) line1.textContent = 'Today is ' + weekday;
        if (line2) line2.textContent = date;
      }
    });
  </script>
</body>

</html>
