<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pad — Drawing App</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="manifest" href="../manifest.json">

  <!-- Early Theme Injection -->
  <script type="module">
    import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
    ThemeManager.init('pad');
  </script>

  <meta name="theme-color" content="#FBFBFD">

  <!-- Design System Tokens -->
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css">

  <!-- Components -->
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js"></script>

  <!-- Pad App Logic -->
  <script type="module" src="./js/main.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-family-base);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .pad-header {
      text-align: center;
      font-size: var(--font-size-display, 2rem);
      font-weight: var(--font-weight-heading, 800);
      color: var(--color-on-surface);
      padding: var(--space-md);
      letter-spacing: 0.01em;
      user-select: none;
      flex-shrink: 0;
    }

    labs-container[fill] {
      flex: 1;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* Canvas container fills entire container */
    .pad-canvas-area {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      overflow: hidden;
      background: var(--base-100);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-xl);
      margin: var(--space-md);
      box-shadow: var(--shadow-dropdown);
    }

    /* Dark theme: reverse canvas background */
    :root.appearance-dark .pad-canvas-area {
      background: var(--base-800);
    }

    #drawingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .pad-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      gap: var(--space-sm);
      background: var(--color-surface);
      border-top: 1px solid var(--color-outline);
      flex-shrink: 0;
      z-index: 2;
    }

    .pad-footer labs-button {
      margin-left: auto;
    }

    .pad-footer-settings {
      width: 2.5em;
      height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-full);
      transition: background 0.15s;
    }

    .pad-footer-settings:hover {
      background: var(--color-surface-variant);
    }

    /* Safe area support for notched devices */
    @supports (padding: max(0px)) {
      .pad-footer {
        padding-bottom: max(var(--space-md), env(safe-area-inset-bottom));
        padding-left: max(var(--space-md), env(safe-area-inset-left));
        padding-right: max(var(--space-md), env(safe-area-inset-right));
      }
    }
  </style>

  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
      var appearance = localStorage.getItem('smoothie-appearance') || 'light';
      root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
      root.classList.remove('appearance-light', 'appearance-dark');
      root.classList.add('theme-' + theme);
      root.classList.add('appearance-' + appearance);
      root.setAttribute('data-color-scheme', appearance);
    })();
  </script>
</head>

<body>
  <!-- Header -->
  <div class="pad-header">Pad</div>

  <!-- Main App Container -->
  <labs-container fill>
    <!-- Canvas Area -->
    <div class="pad-canvas-area">
      <canvas id="drawingCanvas"></canvas>
    </div>
  </labs-container>

  <!-- Footer -->
  <div class="pad-footer">
    <labs-button id="clear-all" variant="secondary">
      <labs-icon slot="icon-left" name="delete"></labs-icon>
      <span>Clear All</span>
    </labs-button>
    <div class="pad-footer-settings" id="settings-toggle">
      <labs-icon name="settings"></labs-icon>
    </div>
  </div>

  <!-- Settings Overlay -->
  <labs-settings-card id="settings-card" hide-confirmation></labs-settings-card>

  <script>
    // Wire up clear button
    document.getElementById('clear-all').addEventListener('click', () => {
      if (confirm('Clear all drawings?')) {
        document.dispatchEvent(new CustomEvent('pad-clear-all'));
      }
    });

    // Wire up settings toggle
    document.getElementById('settings-toggle').addEventListener('click', () => {
      const card = document.getElementById('settings-card');
      if (card) {
        card.style.display = card.style.display === 'none' ? '' : 'none';
      }
    });
  </script>
</body>

</html>
