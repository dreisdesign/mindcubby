<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pad — Drawing App</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Early Theme Injection -->
  <script type="module">
    import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
    ThemeManager.init('pad');
  </script>

  <meta name="theme-color" content="#FBFBFD">

  <!-- Design System Tokens -->
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css?v=71">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css?v=71">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/spacing.css?v=71">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css?v=71">
  <!-- Components -->
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer-settings-wrapper.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-overlay.js?v=35"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js?v=35"></script>

  <!-- Pad App Logic -->
  <script type="module" src="./js/main.js?v=71"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-family-base);
      overflow: hidden;
    }

    labs-container[fill] {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--footer-height, 80px);
      z-index: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      background: var(--color-background);
      gap: 0;
    }

    /* Header positioned inside container */
    labs-header {
      flex-shrink: 0;
      padding: 0;
      background: var(--color-background);
    }

    .pad-header {
      text-align: center;
      font-size: var(--font-size-display, 2rem);
      font-weight: var(--font-weight-heading, 800);
      color: var(--color-on-surface);
      padding: var(--space-md);
      letter-spacing: 0.01em;
      user-select: none;
      flex-shrink: 0;
    }

    /* Removed - using labs-header component instead */

    /* Canvas container fills remaining space */
    .pad-canvas-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      overflow: hidden;
      background: var(--base-100);
      border: 1px solid var(--color-outline);
      border-radius: 20px;
      box-shadow: var(--shadow-dropdown);
    }

    /* Dark theme: reverse canvas background and use appropriate text color */
    :root.appearance-dark .pad-canvas-area {
      background: var(--base-800);
    }

    #drawingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* Safe area support for notched devices */
    @supports (padding: max(0px)) {
      labs-container[fill] {
        padding-top: 16px;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }
  </style>

  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
      var appearance = localStorage.getItem('smoothie-appearance') || 'light';
      root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
      root.classList.remove('appearance-light', 'appearance-dark');
      root.classList.add('theme-' + theme);
      root.classList.add('appearance-' + appearance);
      root.setAttribute('data-color-scheme', appearance);
    })();
  </script>
</head>

<body>
  <!-- Main App Container -->
  <labs-container fill>
    <!-- Header -->
    <labs-header center>
      <div slot="title">Pad</div>
    </labs-header>

    <!-- Canvas Area -->
    <div class="pad-canvas-area">
      <canvas id="drawingCanvas"></canvas>
    </div>
  </labs-container>

  <!-- Footer with Settings Modal (encapsulated in component) -->
  <labs-footer-settings-wrapper hide-reset>
    <labs-button slot="center" id="clear-all" size="large" variant="secondary">
      <labs-icon slot="icon-left" name="electric_bolt"></labs-icon>
      <span>Clear All</span>
    </labs-button>
  </labs-footer-settings-wrapper>

  <script>
    // Wire up clear button
    document.getElementById('clear-all').addEventListener('click', () => {
      if (confirm('Clear all drawings?')) {
        document.dispatchEvent(new CustomEvent('pad-clear-all'));
      }
    });

    // Listen for reset-all from the footer wrapper component
    const footerWrapper = document.querySelector('labs-footer-settings-wrapper');
    if (footerWrapper) {
      footerWrapper.addEventListener('reset-all', () => {
        document.dispatchEvent(new CustomEvent('pad-clear-all'));
      });
    }
  </script>
</body>

</html>
