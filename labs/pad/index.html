<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pad — Drawing App</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="manifest" href="../manifest.json">

  <!-- Early Theme Injection -->
  <script type="module">
    import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
    ThemeManager.init('pad');
  </script>

  <meta name="theme-color" content="#FBFBFD">

  <!-- Design System Tokens -->
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css">

  <!-- Components -->
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js"></script>

  <!-- Pad App Logic -->
  <script type="module" src="./js/main.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-family-base);
      overflow: hidden;
    }

    labs-container[fill] {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--footer-height, 80px);
      z-index: 1;
      overflow: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: var(--color-background);
    }

    /* Header positioned inside container */
    labs-header {
      flex-shrink: 0;
      padding: var(--space-md);
      background: var(--color-background);
    }

    .pad-header {
      text-align: center;
      font-size: var(--font-size-display, 2rem);
      font-weight: var(--font-weight-heading, 800);
      color: var(--color-on-surface);
      padding: var(--space-md);
      letter-spacing: 0.01em;
      user-select: none;
      flex-shrink: 0;
    }

    /* Removed - using labs-header component instead */

    /* Canvas container fills remaining space with margin */
    .pad-canvas-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      overflow: hidden;
      background: var(--base-100);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-xl);
      margin: var(--space-md);
      box-shadow: var(--shadow-dropdown);
    }

    /* Dark theme: reverse canvas background and use appropriate text color */
    :root.appearance-dark .pad-canvas-area {
      background: var(--base-800);
    }

    #drawingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    labs-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
    }

    .pad-footer-settings:hover {
      background: var(--color-surface-variant);
    }

    /* Settings Modal Styles */
    #settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 1rem;
    }

    #settings-modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #settings-modal labs-settings-card {
      width: 90%;
      max-width: 340px;
    }

    /* Safe area support for notched devices */
    @supports (padding: max(0px)) {
      labs-container[fill] {
        padding-left: max(0, env(safe-area-inset-left));
        padding-right: max(0, env(safe-area-inset-right));
        padding-bottom: max(0, env(safe-area-inset-bottom));
      }

      labs-footer {
        padding-bottom: max(0, env(safe-area-inset-bottom));
      }
    }
  </style>

  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
      var appearance = localStorage.getItem('smoothie-appearance') || 'light';
      root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
      root.classList.remove('appearance-light', 'appearance-dark');
      root.classList.add('theme-' + theme);
      root.classList.add('appearance-' + appearance);
      root.setAttribute('data-color-scheme', appearance);
    })();
  </script>
</head>

<body>
  <!-- Main App Container -->
  <labs-container fill>
    <!-- Header -->
    <labs-header title="Pad" center></labs-header>

    <!-- Canvas Area -->
    <div class="pad-canvas-area">
      <canvas id="drawingCanvas"></canvas>
    </div>
  </labs-container>

  <!-- Footer - Outside container to ensure it stays at bottom of viewport -->
  <labs-footer full-width>
    <labs-button id="clear-all" slot="center" variant="secondary">
      <labs-icon slot="icon-left" name="delete"></labs-icon>
      <span>Clear All</span>
    </labs-button>
    <div id="settings-toggle" slot="right" style="width: 2.5em; height: 2.5em; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 9999px; transition: background 0.15s; user-select: none;" title="Settings">
      <labs-icon name="settings"></labs-icon>
    </div>
  </labs-footer>

  <!-- Settings Modal - hidden by default -->
  <div id="settings-modal">
    <labs-settings-card hide-confirmation></labs-settings-card>
  </div>

  <script>
    // Wire up clear button
    document.getElementById('clear-all').addEventListener('click', () => {
      if (confirm('Clear all drawings?')) {
        document.dispatchEvent(new CustomEvent('pad-clear-all'));
      }
    });

    // Settings toggle
    const modal = document.getElementById('settings-modal');
    const settingsToggle = document.getElementById('settings-toggle');
    
    settingsToggle.addEventListener('click', () => {
      modal.classList.toggle('active');
    });

    // Close settings when clicking the card's close button
    const card = modal.querySelector('labs-settings-card');
    if (card) {
      card.addEventListener('close', () => {
        modal.classList.remove('active');
      });
    }

    // Close when clicking backdrop
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });

    // Close settings on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('settings-modal');
        if (modal && modal.classList.contains('active')) {
          modal.classList.remove('active');
        }
      }
    });
  </script>
</body>

</html>
