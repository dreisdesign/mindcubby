<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pad — Drawing App</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="manifest" href="../manifest.json">

  <!-- Early Theme Injection -->
  <script type="module">
    import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
    ThemeManager.init('pad');
  </script>

  <meta name="theme-color" content="#FBFBFD">

  <!-- Design System Tokens -->
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css">
  <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css">

  <!-- Components -->
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js"></script>
  <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer-media-controls.js"></script>

  <!-- Pad App Logic -->
  <script type="module" src="./js/main.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--color-background);
      color: var(--color-on-surface);
      font-family: var(--font-family-base);
      overflow: hidden;
    }

    labs-container[fill] {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: var(--footer-height, 80px);
      z-index: 1;
    }

    /* Canvas container fills remaining space */
    .pad-canvas-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      overflow: hidden;
      background: var(--base-100);
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-xl);
      margin: var(--space-md);
      box-shadow: var(--shadow-dropdown);
    }

    /* Dark theme: reverse canvas background and use appropriate text color */
    :root.theme-dark .pad-canvas-area {
      background: var(--base-800);
    }

    #drawingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    labs-footer-media-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
    }

    /* Safe area support for notched devices */
    @supports (padding: max(0px)) {
      labs-container[fill] {
        padding-left: max(0, env(safe-area-inset-left));
        padding-right: max(0, env(safe-area-inset-right));
        padding-bottom: max(0, env(safe-area-inset-bottom));
      }

      labs-footer-media-controls {
        padding-bottom: max(0, env(safe-area-inset-bottom));
      }
    }
  </style>

  <script>
    (function () {
      var root = document.documentElement;
      var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
      var appearance = localStorage.getItem('smoothie-appearance') || 'light';
      root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
      root.classList.remove('appearance-light', 'appearance-dark');
      root.classList.add('theme-' + theme);
      root.classList.add('appearance-' + appearance);
      root.setAttribute('data-color-scheme', appearance);
    })();
  </script>
</head>

<body>
  <!-- Main App Container -->
  <labs-container fill>
    <!-- Canvas Area -->
    <div class="pad-canvas-area">
      <canvas id="drawingCanvas"></canvas>
    </div>
  </labs-container>

  <!-- Footer - Outside container to ensure it stays at bottom of viewport -->
  <labs-footer-media-controls id="footer" mode="generic"></labs-footer-media-controls>

  <script>
    // Customize footer for pad app - wire reset button to clear canvas
    document.addEventListener('DOMContentLoaded', () => {
      const footer = document.getElementById('footer');
      if (footer && footer.shadowRoot) {
        // Get settings card and wire reset-all event to clear canvas
        setTimeout(() => {
          const settingsCard = footer.shadowRoot.querySelector('labs-settings-card');
          if (settingsCard) {
            settingsCard.addEventListener('reset-all', (e) => {
              // Dispatch custom event for the drawing app to handle
              document.dispatchEvent(new CustomEvent('pad-clear-all', { bubbles: true }));
            });
          }
        }, 100);
      }
    });
  </script>
</body>

</html>
