<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico">
    <title>Labs: Today-List</title>

    <!-- Early Theme Injection -->
    <script type="module">
        import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
        ThemeManager.init('today-list');
    </script>

    <script>
        (function () {
            var root = document.documentElement;
            var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            var appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
            root.classList.remove('appearance-light', 'appearance-dark');
            root.classList.add('theme-' + theme);
            root.classList.add('appearance-' + appearance);
            root.setAttribute('data-color-scheme', appearance);
        })();
    </script>

    <!-- Design System Tokens -->
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css">

    <!-- Components -->
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-metric-card.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-card.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-list-item.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-list-section.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-checkbox.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-dropdown.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-toast.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js"></script>

    <!-- Today-List Logic -->
    <script type="module" src="./js/main.js?v=4"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            color: var(--color-on-surface);
            font-family: var(--font-family-base);
        }

        labs-container {
            flex: 1;
            display: block;
            /* allow the container to scroll internally; keeps footer sticky at scroll boundary */
            min-height: 0;
            overflow: auto;
        }

        labs-list-section {
            margin-top: var(--space-md);
        }

        labs-list-item[data-drop-animating] {
            animation: today-list-drop 220ms ease-out;
        }

        @keyframes today-list-drop {
            from {
                opacity: 0.45;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        labs-metric-card {
            margin-bottom: var(--space-md);
        }

        /* Position toast above the footer */
        labs-toast {
            --toast-bottom: 120px;
        }
    </style>
</head>

<body>
    <labs-container medium>
        <labs-header title="Today" center></labs-header>

        <labs-metric-card id="todo-metric">
            <span slot="label">Tasks</span>
            <span slot="value">0</span>
        </labs-metric-card>

        <!-- Active todos -->
        <labs-list-section id="todo-list">
            <!-- Active todo items will be inserted here -->
        </labs-list-section>

        <!-- Archived todos (collapsible) -->
        <labs-list-section id="archived-section">
            <!-- Archived items will be inserted here if any exist -->
        </labs-list-section>
    </labs-container>

    <!-- Footer -->
    <labs-footer full-width>
        <labs-button id="today-list-settings-toggle" slot="right" variant="tertiary" style="width: auto; padding: 0.5em;">
            <labs-icon name="settings"></labs-icon>
        </labs-button>
    </labs-footer>

    <!-- Settings Modal - hidden by default -->
    <div id="today-list-settings-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 1rem;">
        <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <labs-settings-card id="today-list-settings-card" hide-confirmation style="width: 90%; max-width: 340px;"></labs-settings-card>
        </div>
    </div>

    <!-- Input overlay for adding new todos -->
    <div id="input-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9998; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 1rem;">
        <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <!-- Input card will be dynamically inserted here -->
        </div>
    </div>

    <script>
        // Wire up settings toggle
        const todayListModal = document.getElementById('today-list-settings-modal');
        const todayListSettingsToggle = document.getElementById('today-list-settings-toggle');
        
        todayListSettingsToggle.addEventListener('click', () => {
            const isHidden = todayListModal.style.display === 'none' || !todayListModal.style.display;
            todayListModal.style.display = isHidden ? 'flex' : 'none';
        });

        // Close settings when clicking the card's close button
        const todayListCard = todayListModal.querySelector('labs-settings-card');
        if (todayListCard) {
            todayListCard.addEventListener('close', () => {
                todayListModal.style.display = 'none';
            });
            
            // Handle reset-all event from settings card
            todayListCard.addEventListener('reset-all', () => {
                // Clear all today-list data from localStorage
                const keys = Object.keys(localStorage);
                keys.forEach(key => {
                    if (key.startsWith('today-list-') || key === 'tasks') {
                        localStorage.removeItem(key);
                    }
                });
                // Reload the page to show cleared state
                location.reload();
            });
        }

        // Close when clicking backdrop
        todayListModal.addEventListener('click', (e) => {
            if (e.target === todayListModal) {
                todayListModal.style.display = 'none';
            }
        });

        // Close settings on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('today-list-settings-modal');
                if (modal && modal.style.display === 'flex') {
                    modal.style.display = 'none';
                }
            }
        });
    </script>

        document.addEventListener('keydown', (e) => {

                const card = document.getElementById('today-list-settings-card');
                if (card && card.style.display !== 'none') {
                    card.style.display = 'none';
                }

        });
    </script>
</body>

</html>
