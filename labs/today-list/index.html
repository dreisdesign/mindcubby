<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico">
    <title>Labs: Today-List</title>

    <!-- Early Theme Injection -->
    <script type="module">
        import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
        ThemeManager.init('today-list');
    </script>

    <script>
        (function () {
            var root = document.documentElement;
            var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            var appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
            root.classList.remove('appearance-light', 'appearance-dark');
            root.classList.add('theme-' + theme);
            root.classList.add('appearance-' + appearance);
            root.setAttribute('data-color-scheme', appearance);
        })();
    </script>

    <!-- Design System Tokens -->
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css?v=55">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css?v=55">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/spacing.css?v=55">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css?v=55">

    <!-- Components -->
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-metric-card.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-card.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-list-item.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-list-section.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-checkbox.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-dropdown.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer-settings-wrapper.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-toast.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-overlay.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-input-card.js?v=35"></script>

    <!-- Today-List Logic -->
    <script type="module" src="./js/main.js?v=55"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            color: var(--color-on-surface);
            font-family: var(--font-family-base);
        }

        labs-container {
            flex: 1;
            /* allow the container to scroll internally; keeps footer sticky at scroll boundary */
            min-height: 0;
            overflow: auto;
        }

        labs-list-section {
            margin-top: var(--space-lg);
        }

        labs-list-item[data-drop-animating] {
            animation: today-list-drop 220ms ease-out;
        }

        @keyframes today-list-drop {
            from {
                opacity: 0.45;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        labs-metric-card {\n            margin-bottom: var(--space-lg);\n        }

        /* Position toast above the footer */
        labs-toast {
            --toast-bottom: 120px;
        }
    </style>
</head>

<body>
    <labs-container medium>
        <labs-header title="Today" center></labs-header>

        <labs-metric-card id="todo-metric">
            <span slot="label">Tasks</span>
            <span slot="value">0</span>
        </labs-metric-card>

        <!-- Active todos -->
        <labs-list-section id="todo-list">
            <!-- Active todo items will be inserted here -->
        </labs-list-section>

        <!-- Archived todos (collapsible) -->
        <labs-list-section id="archived-section">
            <!-- Archived items will be inserted here if any exist -->
        </labs-list-section>
    </labs-container>

    <!-- Footer with Settings Modal (encapsulated in component) -->
    <labs-footer-settings-wrapper>
        <labs-button slot="actions" id="export-csv-btn" variant="icon" size="large" aria-label="Export CSV">
            <labs-icon slot="icon-left" name="download"></labs-icon>
        </labs-button>
        <labs-button slot="center" id="add-task-btn" size="large" variant="primary" pill>
            <labs-icon slot="icon-left" name="add"></labs-icon>
            <span>Add</span>
        </labs-button>
    </labs-footer-settings-wrapper>

    <!-- Input overlay for adding new todos -->
    <div id="input-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9998; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 1rem;">
        <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <labs-input-card></labs-input-card>
        </div>
    </div>

    <script>
        // Wire up Add button to open input overlay
        document.addEventListener('DOMContentLoaded', () => {
            const addBtn = document.getElementById('add-task-btn');
            if (addBtn) {
                addBtn.addEventListener('click', () => {
                    const inputOverlay = document.getElementById('input-overlay');
                    if (inputOverlay) {
                        inputOverlay.style.display = 'flex';
                    }
                });
            }
        });

        // Listen for reset-all from the footer wrapper component
        const footerWrapper = document.querySelector('labs-footer-settings-wrapper');
        if (footerWrapper) {
            footerWrapper.addEventListener('reset-all', () => {
                // Clear all today-list data from localStorage
                const keys = Object.keys(localStorage);
                keys.forEach(key => {
                    if (key.startsWith('today-list-') || key === 'tasks') {
                        localStorage.removeItem(key);
                    }
                });
                // Reload the page to show cleared state
                location.reload();
            });
        }
    </script>
</body>

</html>
