<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico">
    <title>Labs: Tracker</title>

    <!-- Early Theme Injection -->
    <script type="module">
        import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
        ThemeManager.init('tracker');
    </script>

    <script>
        (function () {
            var root = document.documentElement;
            var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            var appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
            root.classList.remove('appearance-light', 'appearance-dark');
            root.classList.add('theme-' + theme);
            root.classList.add('appearance-' + appearance);
            root.setAttribute('data-color-scheme', appearance);
        })();
    </script>

    <!-- Design System Tokens -->
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css">

    <!-- Components -->
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-metric-card.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-list-item.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-dropdown.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-toast.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-details.js"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js"></script>

    <!-- Tracker Logic -->
    <script type="module" src="./js/main.js"></script>

    <!-- Register Tracker Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .catch(err => console.warn('Tracker SW registration failed:', err));
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            color: var(--color-on-surface);
            font-family: var(--font-family-base);
        }

        labs-container {
            flex: 1;
            display: block;
            /* allow internal scrolling when content is taller than the viewport */
            min-height: 0;
            overflow: auto;
        }

        .entry-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            margin-top: var(--space-md);
        }

        labs-metric-card {
            margin-bottom: var(--space-md);
        }

        /* Position toast above the footer */
        labs-toast {
            --toast-bottom: 120px;
        }
    </style>
</head>

<body>
    <labs-container medium>
        <labs-header title="Tracker" center></labs-header>

        <labs-metric-card id="tracker-metric">
            <span slot="label">Entries</span>
            <span slot="value">0</span>
        </labs-metric-card>

        <div class="entry-list" id="entry-list">
            <!-- Tracker entries will be inserted here -->
        </div>
    </labs-container>

    <!-- Footer -->
    <labs-footer full-width>
        <labs-button id="tracker-settings-toggle" slot="right" variant="tertiary" style="width: auto; padding: 0.5em;">
            <labs-icon name="settings"></labs-icon>
        </labs-button>
    </labs-footer>

    <!-- Settings Modal - hidden by default -->
    <div id="tracker-settings-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 1rem;">
        <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <labs-settings-card id="tracker-settings-card" hide-confirmation style="width: 90%; max-width: 340px;"></labs-settings-card>
        </div>
    </div>

    <!-- Toast for feedback -->
    <labs-toast id="tracker-toast"></labs-toast>

    <script>
        // Wire up settings toggle
        const trackerModal = document.getElementById('tracker-settings-modal');
        const trackerSettingsToggle = document.getElementById('tracker-settings-toggle');
        
        trackerSettingsToggle.addEventListener('click', () => {
            const isHidden = trackerModal.style.display === 'none' || !trackerModal.style.display;
            trackerModal.style.display = isHidden ? 'flex' : 'none';
        });

        // Close settings when clicking the card's close button
        const trackerCard = trackerModal.querySelector('labs-settings-card');
        if (trackerCard) {
            trackerCard.addEventListener('close', () => {
                trackerModal.style.display = 'none';
            });
        }

        // Close when clicking backdrop
        trackerModal.addEventListener('click', (e) => {
            if (e.target === trackerModal) {
                trackerModal.style.display = 'none';
            }
        });

        // Close settings on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('tracker-settings-modal');
                if (modal && modal.style.display === 'flex') {
                    modal.style.display = 'none';
                }
            }
        });
    </script>
</body>

</html>
