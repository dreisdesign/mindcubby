<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico">
    <title>Labs: Tracker</title>

    <!-- Early Theme Injection -->
    <script type="module">
        import { ThemeManager } from '/libs/smoothie-design-system/v3.0/utils/theme-manager.js';
        ThemeManager.init('tracker');
    </script>

    <script>
        (function () {
            var root = document.documentElement;
            var theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            var appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.remove('theme-blueberry', 'theme-strawberry', 'theme-vanilla');
            root.classList.remove('appearance-light', 'appearance-dark');
            root.classList.add('theme-' + theme);
            root.classList.add('appearance-' + appearance);
            root.setAttribute('data-color-scheme', appearance);
        })();
    </script>

    <!-- Design System Tokens -->
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/colors.css?v=145">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/typography.css?v=145">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/tokens/spacing.css?v=145">
    <link rel="stylesheet" href="/libs/smoothie-design-system/v3.0/styles/flavors.css?v=145">

    <!-- Components -->
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-header.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-footer-settings-wrapper.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-container.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-metric-card.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-list-item.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-dropdown.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-icon.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-overlay.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-button.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-toast.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-details.js?v=35"></script>
    <script type="module" src="/libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js?v=35"></script>

    <!-- Tracker Logic -->
    <script type="module" src="./js/main.js?v=145"></script>

    <!-- Register Tracker Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .catch(err => console.warn('Tracker SW registration failed:', err));
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: var(--space-lg) 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            color: var(--color-on-surface);
            font-family: var(--font-family-base);
        }

        labs-container {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .entry-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        /* Position toast above the footer */
        labs-toast {
            --toast-bottom: 120px;
        }
    </style>
</head>

<body>
    <labs-container medium>
        <div class="content-wrapper">
            <labs-header center>
                <div slot="title">Tracker</div>
            </labs-header>

            <labs-metric-card id="tracker-metric">
                <span slot="label">Entries</span>
                <span slot="value">0</span>
            </labs-metric-card>

            <div class="entry-list" id="entry-list">
                <!-- Tracker entries will be inserted here -->
            </div>
        </div>
    </labs-container>

    <!-- Footer with Settings Modal (encapsulated in component) -->
    <labs-footer-settings-wrapper>
        <labs-button slot="center" id="add-item-btn" size="large" variant="primary" pill>
            <labs-icon slot="icon-left" name="add"></labs-icon>
            <span>Add</span>
        </labs-button>
        <labs-button slot="actions" id="clear-archived-btn" size="small" variant="secondary" hidden>
            <labs-icon slot="icon-left" name="delete_forever"></labs-icon>
            <span>Clear Archived</span>
        </labs-button>
    </labs-footer-settings-wrapper>

    <!-- Toast for feedback -->
    <labs-toast id="tracker-toast"></labs-toast>

    <script>
        // Listen for reset-all from the footer wrapper component
        const footerWrapper = document.querySelector('labs-footer-settings-wrapper');
        if (footerWrapper) {
            footerWrapper.addEventListener('reset-all', () => {
                // Clear all tracker data from localStorage
                localStorage.removeItem('tracker-items');
                localStorage.removeItem('tracker-flavor');
                localStorage.removeItem('tracker-theme');
                // Reload the page to show cleared state
                location.reload();
            });
        }
    </script>
</body>

</html>
