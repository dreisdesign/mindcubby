<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCubby Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #333;
            line-height: 1.5;
            font-size: 14px;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }

        .status {
            padding: 8px 12px;
            border: 1px solid #999;
            background: #f9f9f9;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .status.loading {
            display: block;
        }

        .status.error {
            border-color: #999;
            background: #fff;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1px;
            background: #999;
            border: 1px solid #999;
        }

        .product {
            background: white;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 350px;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
            border: 1px solid #ddd;
        }

        .product-title {
            font-weight: normal;
            font-size: 13px;
            line-height: 1.4;
            flex: 1;
        }

        .product-price {
            font-weight: bold;
            font-size: 14px;
        }

        .product-id {
            font-size: 11px;
            color: #999;
        }

        .buy-button {
            padding: 6px 10px;
            border: 1px solid #999;
            background: white;
            cursor: pointer;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }

        .buy-button:hover {
            background: #f5f5f5;
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MindCubby Shop</h1>
        <p class="subtitle">3D Printable Designs</p>

        <div id="status" class="status loading">Loading products...</div>
        <div id="products-grid" class="products-grid"></div>
    </div>

    <script>
        async function loadProducts() {
            const statusEl = document.getElementById('status');
            const gridEl = document.getElementById('products-grid');

            try {
                const response = await fetch('/api/etsy/cached');

                if (!response.ok) {
                    const error = await response.json();
                    statusEl.textContent = `Error: ${error.message || error.error}`;
                    statusEl.className = 'status error';
                    return;
                }

                const data = await response.json();
                const products = data.products || [];

                if (products.length === 0) {
                    gridEl.innerHTML = '<div class="empty">No products found</div>';
                    statusEl.textContent = 'Ready';
                    statusEl.className = 'status';
                    return;
                }

                statusEl.textContent = `Loaded ${products.length} products`;
                statusEl.className = 'status';

                gridEl.innerHTML = products.map(product => {
                    // Get first image URL
                    let imageUrl = null;
                    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                        const img = product.images[0];
                        imageUrl = img.url_570xN || img.url_fullxfull || img.url;
                    }

                    // Format price - Etsy API returns { amount, divisor, currency_code }
                    let priceDisplay = 'N/A';
                    if (product.price && typeof product.price === 'object' && product.price.amount && product.price.divisor) {
                        const priceInDollars = product.price.amount / product.price.divisor;
                        priceDisplay = `$${priceInDollars.toFixed(2)}`;
                    }

                    return `
                        <div class="product">
                            ${imageUrl ? `
                                <img class="product-image" src="${imageUrl}" alt="${product.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                                <div class="product-image" style="background: #e5e5e5; display: none; align-items: center; justify-content: center;">
                                    <span style="color: #999;">No image</span>
                                </div>
                            ` : `
                                <div class="product-image" style="background: #e5e5e5; display: flex; align-items: center; justify-content: center;">
                                    <span style="color: #999;">No image</span>
                                </div>
                            `}
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">${priceDisplay}</div>
                            <div class="product-id">ID: ${product.listing_id}</div>
                            <a href="https://www.etsy.com/listing/${product.listing_id}" target="_blank" style="text-decoration: none;">
                                <button class="buy-button">View on Etsy</button>
                            </a>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
                statusEl.className = 'status error';
            }
        }

        loadProducts();
    </script>
</body>

</html>
