<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - Smoothie Design System</title>
    <link rel="icon" href="../../../libs/smoothie-design-system/v3.0/labs_logo--smoothie.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../libs/smoothie-design-system/v3.0/styles/main.css">
    <!-- Prevent FOUC by applying theme classes synchronously before CSS renders -->
    <script>
        (function () {
            const root = document.documentElement;
            const theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            const appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.add(`theme-${theme}`, `appearance-${appearance}`);
        })();
    </script>
    <script type="module">
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-button.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-header.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-icon.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-breadcrumbs.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-page-layout.js';
    </script>
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: auto;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--color-background, #fff);
            color: var(--color-on-background, #333);
            padding: 2rem;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        /* Only hide overflow when embedded in iframe */
        html.in-iframe body {
            overflow: auto;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-on-background, #333);
        }

        .subtitle {
            color: var(--color-on-surface-variant, #999);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .section {
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .section h2 {
            font-size: 1.25rem;
            margin-bottom: 0;
            font-weight: 600;
            border-bottom: 1px solid var(--color-on-surface-variant, #ccc);
            padding-bottom: 0.5rem;
            color: var(--color-on-background, #333);
        }

        .preview {
            border: 1px solid var(--color-on-surface-variant, #ccc);
            border-radius: 8px;
            overflow: hidden;
            background: var(--color-surface, #f5f5f5);
        }

        .back-link {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .back-link a {
            color: var(--color-primary, #007acc);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-link">
            <a href="../">← Components</a>
        </div>

        <labs-page-layout title="Header" subtitle="Page header template component">
            <labs-breadcrumbs slot="breadcrumbs">
                <a href="../../">Smoothie</a>
                <a href="../">Components</a>
                <span>Header</span>
            </labs-breadcrumbs>

            <section class="section">
                <h2>Basic Header</h2>
                <div class="preview">
                    <labs-header>
                        <h1 slot="title">Page Title</h1>
                        <p slot="subtitle">Optional subtitle or description</p>
                    </labs-header>
                </div>
            </section>

            <section class="section">
                <h2>Header with Actions</h2>
                <div class="preview">
                    <labs-header>
                        <h1 slot="title">Dashboard</h1>
                        <p slot="subtitle">Real-time metrics and analytics</p>
                        <labs-button slot="actions" variant="primary">Export Data</labs-button>
                        <labs-button slot="actions" variant="secondary">Settings</labs-button>
                    </labs-header>
                </div>
            </section>

            <section class="section">
                <h2>Header with Breadcrumbs</h2>
                <div class="preview">
                    <labs-header>
                        <h1 slot="title">User Management</h1>
                        <labs-breadcrumbs slot="breadcrumbs">
                            <a href="/">Home</a>
                            <a href="/admin">Admin</a>
                            <span>Users</span>
                        </labs-breadcrumbs>
                    </labs-header>
                </div>
            </section>
        </labs-page-layout>
    </div>

    <div class="floating-toolbar">
        <labs-theme-button id="theme-selector"></labs-theme-button>
        <labs-appearance-toggle id="appearance-toggle"></labs-appearance-toggle>
    </div>

    <script type="module">
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-theme-button.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-appearance-toggle.js';

        // Handle theme and appearance synchronization
        document.addEventListener('theme-changed', (event) => {
            const newTheme = event.detail.theme;
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'smoothie-theme-update', theme: newTheme }, '*');
            }
        });

        document.addEventListener('appearance-changed', (event) => {
            const newAppearance = event.detail.appearance;
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'smoothie-theme-update', appearance: newAppearance }, '*');
            }
        });

        window.addEventListener('message', (event) => {
            try {
                if (event.data.type === 'smoothie-theme-update') {
                    const root = document.documentElement;
                    if (event.data.theme) {
                        root.classList.remove('theme-vanilla', 'theme-blueberry', 'theme-strawberry');
                        root.classList.add(`theme-${event.data.theme}`);
                        localStorage.setItem('smoothie-theme', event.data.theme);
                    }
                    if (event.data.appearance) {
                        root.classList.remove('appearance-light', 'appearance-dark');
                        root.classList.add(`appearance-${event.data.appearance}`);
                        localStorage.setItem('smoothie-appearance', event.data.appearance);
                    }
                }
            } catch (e) {
                // Silently fail if we can't access parent (cross-origin)
            }
        });
    </script>
</body>

</html>
