<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Smoothie Design System</title>
    <link rel="icon" href="../../../libs/smoothie-design-system/v3.0/labs_logo--smoothie.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../libs/smoothie-design-system/v3.0/styles/main.css">
    <script>
        (function () {
            const root = document.documentElement;
            const theme = localStorage.getItem('smoothie-theme') || 'vanilla';
            const appearance = localStorage.getItem('smoothie-appearance') || 'light';
            root.classList.add(`theme-${theme}`, `appearance-${appearance}`);
        })();
    </script>
    <script type="module">
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-overlay.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-settings-card.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-button.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-icon.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-breadcrumbs.js';
        import '../../../libs/smoothie-design-system/v3.0/src/components/labs-page-layout.js';
    </script>
    <style>
        body, h1, h2, h3, p {
            margin: 0;
            padding: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--color-background, #fff);
            color: var(--color-on-background, #333);
            padding: 2rem;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .demo {
            padding: 1rem;
            background: var(--color-surface, #f5f5f5);
            border-radius: 8px;
            border: 1px solid var(--color-on-surface-variant, #ccc);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 100px;
            position: relative;
        }

        .demo labs-button {
            position: static;
        }
    </style>
</head>

<body>
    <div class="container">
        <labs-page-layout title="Modal" subtitle="Overlay component for dialogs">
            <labs-breadcrumbs slot="breadcrumbs">
                <a href="../../">Smoothie</a>
                <a href="../">Patterns</a>
                <span>Modal</span>
            </labs-breadcrumbs>

            <section style="margin-top: 2rem;">
                <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Modal</h2>
                <p style="color: var(--color-on-surface-variant, #999); margin-bottom: 1.5rem; font-size: 0.9rem;">
                    Overlay component with theme selector and appearance toggle.
                    <br><br>
                    <strong>Click the gear icon to open</strong> — positioning and backdrop are handled by the component.
                </p>
                <div class="demo">
                    <labs-overlay id="demo-overlay" size="medium" transparent>
                        <labs-settings-card id="demo-card"></labs-settings-card>
                    </labs-overlay>
                    <labs-button id="demo-btn" variant="icon" size="large">
                        <labs-icon slot="icon-left" name="settings" width="24" height="24"></labs-icon>
                    </labs-button>
                </div>
            </section>

            <section style="margin-top: 3rem;">
                <h3 style="font-size: 1rem; margin-bottom: 1rem;">Related Patterns</h3>
                <p style="color: var(--color-on-surface-variant, #999); font-size: 0.9rem;">
                    <a href="../settings-modal/" style="color: var(--color-primary, #007bff); text-decoration: none;">Settings Modal</a> — 
                    Same modal implementation with settings-specific content
                </p>
            </section>
        </labs-page-layout>
    </div>

    <script>
        const demoBtn = document.getElementById('demo-btn');
        const demoOverlay = document.getElementById('demo-overlay');
        const demoCard = document.getElementById('demo-card');
        
        // Open overlay when button clicked
        demoBtn.addEventListener('click', () => demoOverlay.toggle());
        
        // Close overlay when card close is triggered
        if (demoCard && demoOverlay) {
            demoCard.addEventListener('close', () => demoOverlay.close());
        }
    </script>

</html>
