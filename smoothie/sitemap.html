<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoothie Design System - Complete Sitemap</title>
    <link rel="icon" href="../libs/smoothie-design-system/v3.0/labs_logo--smoothie.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #333;
            padding: 2rem;
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 0.5rem; font-size: 2rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }
        section { 
            background: white;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { 
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #222;
            border-bottom: 3px solid #0066cc;
            padding-bottom: 0.5rem;
        }
        ul { list-style: none; }
        li { margin-bottom: 0.5rem; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smoothie Design System</h1>
        <p class="subtitle">Complete sitemap auto-discovered from all directories</p>
        <div id="content"></div>
    </div>

    <script>
        const sections = [
            { name: '0. Tokens', path: './tokens/', icon: '🎨' },
            { name: '1. Foundations', path: './foundations/', icon: '🏗️' },
            { name: '2. Components', path: './components/', icon: '🧩' },
            { name: '4. Usage Patterns', path: './patterns/', icon: '📐' }
        ];

        async function fetchDirectoryListing(path) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error(`${response.status}`);
                const html = await response.text();
                
                // Parse links from Python http.server directory listing
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'))
                    .map(a => ({ href: a.href, text: a.textContent }))
                    .filter(link => link.href.includes(path) && link.href !== path && !link.href.includes('?'))
                    .map(link => {
                        const name = link.text.replace(/\/$/, '');
                        return { name, href: link.href };
                    });
                
                return links;
            } catch (error) {
                console.error(`Error fetching ${path}:`, error);
                return [];
            }
        }

        async function buildSitemap() {
            const content = document.getElementById('content');
            
            for (const section of sections) {
                const links = await fetchDirectoryListing(section.path);
                
                const html = `
                    <section>
                        <h2>${section.icon} ${section.name}</h2>
                        <ul>
                            ${links.map(link => `<li><a href="${link.href}">${link.name}</a></li>`).join('')}
                        </ul>
                    </section>
                `;
                
                content.insertAdjacentHTML('beforeend', html);
            }
        }

        buildSitemap();
    </script>
</body>
</html>
