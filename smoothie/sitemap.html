<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoothie Design System - Sitemap</title>
</head>
<body>
    <h1>Smoothie Design System - Sitemap</h1>
    <div id="content"></div>

    <script>
        const sections = [
            { name: '0. Tokens', path: './tokens/' },
            { name: '1. Foundations', path: './foundations/' },
            { name: '2. Components', path: './components/' },
            { name: '4. Usage Patterns', path: './patterns/' }
        ];

        async function fetchDirectoryListing(path) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error(`${response.status}`);
                const html = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Resolve links relative to the directory path, not the current page
                const baseUrl = new URL(path, window.location.href).href;
                
                const links = Array.from(doc.querySelectorAll('a'))
                    .filter(a => {
                        const href = a.getAttribute('href') || '';
                        const text = a.textContent.trim();
                        return href && href.endsWith('/') && !href.includes('?') && text !== 'Parent Directory';
                    })
                    .map(a => {
                        const href = new URL(a.getAttribute('href'), baseUrl).href;
                        const text = a.textContent.trim();
                        const name = text.replace(/\/$/, '').trim();
                        return { name, href };
                    })
                    .filter(link => link.name && link.name.length > 0);
                
                return links;
            } catch (error) {
                console.error(`Error fetching ${path}:`, error);
                return [];
            }
        }

        async function buildSitemap() {
            const content = document.getElementById('content');
            
            for (const section of sections) {
                const links = await fetchDirectoryListing(section.path);
                
                const html = `
                    <h2>${section.name}</h2>
                    <ul>
                        ${links.map(link => `<li><a href="${link.href}">${link.name}</a></li>`).join('')}
                    </ul>
                `;
                
                content.insertAdjacentHTML('beforeend', html);
            }
        }

        buildSitemap();
    </script>
    <p><a href="./index.html">Back to Smoothie Home</a></p>
</body>
</html>
